! =====================================================================
!  Cisco vIOS-L2 (IOS 15.2) - Authenticator 802.1X du labo NAC
!  A coller en mode configuration (configure terminal).
!  <CLE_RADIUS> : clé partagée, identique à celle déclarée dans Cisco ISE.
!  Ne jamais publier la vraie valeur.
! =====================================================================
hostname Switch_ISE
!
! --- Serveur RADIUS : Cisco ISE ---
radius server ISE
 address ipv4 192.168.10.30 auth-port 1812 acct-port 1813
 key <CLE_RADIUS>
!
! --- Modèle AAA ---
aaa new-model
aaa authentication dot1x default group radius
! Sans la ligne suivante, le switch ignore le VLAN et la dACL envoyés par ISE
aaa authorization network default group radius
! Traçabilité des sessions 802.1X (Accounting, UDP 1813)
aaa accounting dot1x default start-stop group radius
!
! --- Activation globale de 802.1X ---
dot1x system-auth-control
!
! --- VLAN du plan de segmentation ---
vlan 10
 name ADMIN
vlan 15
 name IT
vlan 20
 name COLLABORATEURS
vlan 99
 name INVITE
!
! --- Gi0/0 : liaison vers ISE et l'AD (CloudISE / virbr-lab) ---
! Ne JAMAIS activer 802.1X sur ce port : le switch se couperait de son serveur RADIUS.
!
! --- Gi0/1 : port d'accès contrôlé (CloudAccess / virbr-access, client Debian) ---
interface GigabitEthernet0/1
 switchport mode access
 authentication port-control auto
 ! Echec d'authentification ou absence de Supplicant : repli local en VLAN 99
 authentication event fail action authorize vlan 99
 authentication event no-response action authorize vlan 99
 dot1x pae authenticator
 ! 5 s d'attente après un échec (au lieu de 60) pour accélérer les tests
 dot1x timeout quiet-period 5
!
end
!
! --- Vérifications utiles ---
! show authentication sessions interface Gi0/1 details
! show vlan brief
! show ip access-lists
! test aaa group radius <utilisateur> <mot_de_passe> new-code
